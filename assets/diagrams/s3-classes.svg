text x="298.5" y="385.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">30 days</text><rect x="274" y="402" width="60" height="6" rx="3" class="f-canvas"/><rect x="274" y="402" width="33" height="6" rx="3" class="f-accent"/><rect x="44" y="430" width="304" height="62" rx="10" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="58" y="456" font-size="15" font-weight="700" class="f-ink">One Zone-IA</text><text x="58" y="477" font-size="13" font-weight="400" class="f-muted">Milliseconds · single AZ</text><rect x="263" y="440" width="71" height="22" rx="11" stroke-width="1" class="f-canvas s-amber-line"/><text x="298.5" y="455.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">30 days</text><rect x="274" y="472" width="60" height="6" rx="3" class="f-canvas"/><rect x="274" y="472" width="26" height="6" rx="3" class="f-accent"/><rect x="44" y="500" width="304" height="62" rx="10" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="58" y="526" font-size="15" font-weight="700" class="f-ink">Glacier Instant</text><text x="58" y="547" font-size="13" font-weight="400" class="f-muted">Milliseconds · retrieval fee</text><rect x="263" y="510" width="71" height="22" rx="11" stroke-width="1" class="f-canvas s-violet-line"/><text x="298.5" y="525.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">90 days</text><rect x="274" y="542" width="60" height="6" rx="3" class="f-canvas"/><rect x="274" y="542" width="10" height="6" rx="3" class="f-accent"/><rect x="44" y="570" width="304" height="62" rx="10" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="58" y="596" font-size="15" font-weight="700" class="f-ink">Glacier Flexible</text><text x="58" y="617" font-size="13" font-weight="400" class="f-muted">Minutes to 12 hours</text><rect x="263" y="580" width="71" height="22" rx="11" stroke-width="1" class="f-canvas s-violet-line"/><text x="298.5" y="595.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">90 days</text><rect x="274" y="612" width="60" height="6" rx="3" class="f-canvas"/><rect x="274" y="612" width="9" height="6" rx="3" class="f-accent"/><rect x="44" y="640" width="304" height="62" rx="10" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="58" y="666" font-size="15" font-weight="700" class="f-ink">Deep Archive</text><text x="58" y="687" font-size="13" font-weight="400" class="f-muted">12 to 48 hours</text><rect x="256" y="650" width="78" height="22" rx="11" stroke-width="1" class="f-canvas s-violet-line"/><text x="295" y="665.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">180 days</text><rect x="274" y="682" width="60" height="6" rx="3" class="f-canvas"/><rect x="274" y="682" width="4" height="6" rx="3" class="f-accent"/><rect x="20" y="728" width="350" height="210" rx="12" class="f-panel"/><text x="36" y="756" font-size="13" font-weight="700" class="f-ink">Remember</text><circle cx="39" cy="777.5" r="2.5" class="f-accent"/><text x="50" y="782" font-size="13" font-weight="400" class="f-ink">Delete or move an object before its minimum</text><text x="50" y="800" font-size="13" font-weight="400" class="f-ink">duration and you still pay for the full</text><text x="50" y="818" font-size="13" font-weight="400" class="f-ink">minimum.</text><circle cx="39" cy="836.5" r="2.5" class="f-accent"/><text x="50" y="841" font-size="13" font-weight="400" class="f-ink">Lifecycle rules move objects down the ladder</text><text x="50" y="859" font-size="13" font-weight="400" class="f-ink">automatically.</text><circle cx="39" cy="877.5" r="2.5" class="f-accent"/><text x="50" y="882" font-size="13" font-weight="400" class="f-ink">Intelligent-Tiering has no retrieval fee; it</text><text x="50" y="900" font-size="13" font-weight="400" class="f-ink">charges a small monitoring fee per object</text><text x="50" y="918" font-size="13" font-weight="400" class="f-ink">instead.</text></svg>
