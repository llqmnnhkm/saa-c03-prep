<svg class="ig-svg" role="img" aria-label="S3 storage classes" xmlns="http://www.w3.org/2000/svg" viewBox="0 128 390 830" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="s3-classes-m-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-accent"/></marker><marker id="s3-classes-m-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-muted"/></marker></defs><rect width="390" height="830" class="f-canvas" y="128"/><rect x="20" y="141" width="14" height="14" rx="4" stroke-width="1" class="f-green-fill s-green-line"/><text x="42" y="152" font-size="13" font-weight="600" class="f-ink">Frequent</text><rect x="122" y="141" width="14" height="14" rx="4" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="144" y="152" font-size="13" font-weight="600" class="f-ink">Infrequent</text><rect x="236" y="141" width="14" height="14" rx="4" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="258" y="152" font-size="13" font-weight="600" class="f-ink">Archive</text><text x="20" y="178" font-size="13" font-weight="400" class="f-muted">Pill: minimum storage duration. Bar: storage price</text><text x="20" y="196" font-size="13" font-weight="400" class="f-muted">per GB.</text><line x1="32" y1="220" x2="32" y2="702" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#s3-classes-m-acc)" class="s-accent"/><text x="12" y="461" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(90 12 461)" class="f-accent">Storage cost falls</text><li