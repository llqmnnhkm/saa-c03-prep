<svg class="ig-svg" role="img" aria-label="Load balancers by layer" xmlns="http://www.w3.org/2000/svg" viewBox="0 154 390 1074" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="load-balancers-m-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-accent"/></marker><marker id="load-balancers-m-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-muted"/></marker></defs><rect width="390" height="1074" class="f-canvas" y="154"/><rect x="20" y="166" width="350" height="298" rx="14" class="f-panel"/><rect x="28" y="174" width="46" height="282" rx="10" stroke-width="1" class="f-green-fill s-green-line"/><text x="51" y="200" font-size="13" font-weight="600" text-anchor="middle" class="f-green-ink">Layer</text><text x="51" y="230" font-size="28" font-weight="700" text-anchor="middle" class="f-green-ink">7</text><text x="86" y="198" font-size="16" font-weight="700" class="f-ink">Application Load Balancer</text><text x="86" y="220" font-size="13" font-weight="400" class="f-muted">Reads HTTP requests and routes by URL</text><text x="86" y="238" font-size="13" font-weight="400" class="f-muted">path, host name or header.</text><path d="M146 300 H170 V278 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#load-balancers-m-acc)" class="s-accent"/><path d="M146 300 H170 V322 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#load-balancers-m-acc)" class="s-accent"/><text x="178" y="273" font-size="13" font-weight="600" class="f-accent">/api/*</text><text x="178" y="317" font-size="13" font-weight="600" class="f-accent">m.site.com</text><rect x="86" y="280" width="60" height="40" rx="8" stroke-width="1" class="f-green-fill s-green-line"/><text x="116" y="304.5" font-size="13" font-weight="600" text-anchor="middle" class="f-green-ink">ALB</text><rect x="252" y="262" width="104" height="32" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="304" y="282.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">API servers</text><rect x="252" y="306" width="104" height="32" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="304" y="326.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Mobile site</text><rect x="86" y="358" width="106" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="139" y="374.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">HTTP / HTTPS</text><rect x="198" y="358" width="92" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="244" y="374.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Path rules</text><rect x="86" y="390" width="92" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="132" y="406.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Host rules</text><rect x="184" y="390" width="70" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="219" y="406.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Headers</text><rect x="260" y="390" width="41" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="280.5" y="406.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">WAF</text><rect x="86" y="422" width="120" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="146" y="438.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Lambda targets</text><rect x="20" y="478" width="350" height="270" rx="14" class="f-panel"/><rect x="28" y="486" width="46" height="254" rx="10" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="51" y="512" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Layer</text><text x="51" y="542" font-size="28" font-weight="700" text-anchor="middle" class="f-amber-ink">4</text><text x="86" y="510" font-size="16" font-weight="700" class="f-ink">Network Load Balancer</text><text x="86" y="532" font-size="13" font-weight="400" class="f-muted">Forwards TCP and UDP connections with</text><text x="86" y="550" font-size="13" font-weight="400" class="f-muted">very low latency. One static IP per AZ.</text><line x1="146" y1="604" x2="252" y2="604" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#load-balancers-m-acc)" class="s-accent"/><text x="199" y="597" font-size="13" font-weight="600" text-anchor="middle" class="f-accent">TCP / UDP</text><rect x="86" y="584" width="60" height="40" rx="8" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="116" y="608.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">NLB</text><rect x="86" y="632" width="86" height="22" rx="11" stroke-width="1" class="f-canvas s-amber-line"/><text x="129" y="647.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Static IP</text><rect x="252" y="584" width="104" height="40" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="304" y="600" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Targets</text><text x="304" y="617" font-size="13" font-weight="400" text-anchor="middle" class="f-muted">TCP :443</text><rect x="86" y="674" width="127" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="149.5" y="690.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">TCP / UDP / TLS</text><rect x="219" y="674" width="84" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="261" y="690.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Static IP</text><rect x="86" y="706" width="92" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="132" y="722.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Elastic IP</text><rect x="184" y="706" width="142" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="255" y="722.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">Millions of req/s</text><rect x="20" y="762" width="350" height="284" rx="14" class="f-panel"/><rect x="28" y="770" width="46" height="268" rx="10" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="51" y="796" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">Layer</text><text x="51" y="826" font-size="28" font-weight="700" text-anchor="middle" class="f-violet-ink">3</text><text x="86" y="794" font-size="16" font-weight="700" class="f-ink">Gateway Load Balancer</text><text x="86" y="816" font-size="13" font-weight="400" class="f-muted">Sends every IP packet through a fleet</text><text x="86" y="834" font-size="13" font-weight="400" class="f-muted">of firewall or inspection appliances,</text><text x="86" y="852" font-size="13" font-weight="400" class="f-muted">then on to the app.</text><path d="M146 914 H170 V892 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#load-balancers-m-acc)" marker-start="url(#load-balancers-m-acc)" class="s-accent"/><path d="M146 914 H170 V936 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#load-balancers-m-acc)" marker-start="url(#load-balancers-m-acc)" class="s-accent"/><text x="178" y="911" font-size="13" font-weight="600" class="f-accent">GENEVE</text><text x="178" y="927" font-size="13" font-weight="600" class="f-accent">6081</text><rect x="86" y="894" width="60" height="40" rx="8" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="116" y="918.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">GWLB</text><rect x="252" y="876" width="104" height="32" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="304" y="896.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Firewall</text><rect x="252" y="920" width="104" height="32" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="304" y="940.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Firewall</text><rect x="86" y="972" width="92" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="132" y="988.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">IP packets</text><rect x="184" y="972" width="99" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="233.5" y="988.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">GENEVE 6081</text><rect x="86" y="1004" width="156" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="164" y="1020.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">3rd-party firewalls</text><rect x="248" y="1004" width="84" height="24" rx="12" stroke-width="1" class="f-canvas s-line"/><text x="290" y="1020.5" font-size="13" font-weight="400" text-anchor="middle" class="f-ink">IDS / IPS</text><rect x="20" y="1070" width="350" height="138" rx="12" class="f-panel"/><text x="36" y="1098" font-size="13" font-weight="700" class="f-ink">Exam cues</text><circle cx="39" cy="1119.5" r="2.5" class="f-accent"/><text x="50" y="1124" font-size="13" font-weight="400" class="f-ink">URL path or host name → ALB</text><circle cx="39" cy="1142.5" r="2.5" class="f-accent"/><text x="50" y="1147" font-size="13" font-weight="400" class="f-ink">Static IP, UDP or extreme performance → NLB</text><circle cx="39" cy="1165.5" r="2.5" class="f-accent"/><text x="50" y="1170" font-size="13" font-weight="400" class="f-ink">Inspect all traffic with third-party</text><text x="50" y="1188" font-size="13" font-weight="400" class="f-ink">appliances → GWLB</text></svg>
