<svg class="ig-svg" role="img" aria-label="Messaging patterns" xmlns="http://www.w3.org/2000/svg" viewBox="0 154 390 1231" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="messaging-m-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-accent"/></marker><marker id="messaging-m-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-muted"/></marker></defs><rect width="390" height="1231" class="f-canvas" y="154"/><rect x="20" y="166" width="350" height="315" rx="14" class="f-panel"/><text x="36" y="200" font-size="17" font-weight="700" class="f-ink">SQS queue</text><rect x="305" y="182" width="49" height="22" rx="11" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="329.5" y="197.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Pull</text><text x="36" y="224" font-size="13" font-weight="400" class="f-muted">Producers send messages to a queue. A consumer</text><text x="36" y="242" font-size="13" font-weight="400" class="f-muted">polls, processes and deletes each one.</text><rect x="36" y="266" width="76" height="40" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="74" y="290.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Producer</text><line x1="112" y1="286" x2="134" y2="286" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="134" y="266" width="118" height="40" rx="8" stroke-width="1" class="f-amber-fill s-amber-line"/><rect x="146" y="278" width="16" height="16" rx="4" class="f-accent"/><rect x="170" y="278" width="16" height="16" rx="4" class="f-accent"/><rect x="194" y="278" width="16" height="16" rx="4" class="f-accent"/><rect x="218" y="278" width="16" height="16" rx="4" class="f-accent"/><line x1="252" y1="286" x2="270" y2="286" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="270" y="266" width="84" height="40" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="312" y="290.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Consumer</text><circle cx="39" cy="331.5" r="2.5" class="f-accent"/><text x="50" y="336" font-size="13" font-weight="400" class="f-ink">Each message is handled by one consumer</text><circle cx="39" cy="354.5" r="2.5" class="f-accent"/><text x="50" y="359" font-size="13" font-weight="400" class="f-ink">Buffers traffic spikes and decouples</text><text x="50" y="377" font-size="13" font-weight="400" class="f-ink">services</text><circle cx="39" cy="395.5" r="2.5" class="f-accent"/><text x="50" y="400" font-size="13" font-weight="400" class="f-ink">Standard: at-least-once. FIFO: ordered,</text><text x="50" y="418" font-size="13" font-weight="400" class="f-ink">exactly-once.</text><circle cx="39" cy="436.5" r="2.5" class="f-accent"/><text x="50" y="441" font-size="13" font-weight="400" class="f-ink">Retention 1 minute to 14 days (default 4</text><text x="50" y="459" font-size="13" font-weight="400" class="f-ink">days)</text><rect x="20" y="495" width="350" height="342" rx="14" class="f-panel"/><text x="36" y="529" font-size="17" font-weight="700" class="f-ink">SNS fan-out</text><rect x="305" y="511" width="49" height="22" rx="11" stroke-width="1" class="f-green-fill s-green-line"/><text x="329.5" y="526.5" font-size="13" font-weight="600" text-anchor="middle" class="f-green-ink">Push</text><text x="36" y="553" font-size="13" font-weight="400" class="f-muted">A message published to a topic is pushed to</text><text x="36" y="571" font-size="13" font-weight="400" class="f-muted">every subscriber at once. Here: three SQS</text><text x="36" y="589" font-size="13" font-weight="400" class="f-muted">queues.</text><rect x="36" y="647" width="76" height="40" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="74" y="671.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Publisher</text><line x1="112" y1="667" x2="134" y2="667" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><path d="M206 667 H228 V629 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="252" y="613" width="102" height="32" rx="8" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="303" y="633.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Billing</text><path d="M206 667 H228 V667 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="252" y="651" width="102" height="32" rx="8" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="303" y="671.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Shipping</text><path d="M206 667 H228 V705 H252" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="252" y="689" width="102" height="32" rx="8" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="303" y="709.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Analytics</text><rect x="134" y="647" width="72" height="40" rx="8" stroke-width="1" class="f-green-fill s-green-line"/><text x="170" y="671.5" font-size="13" font-weight="600" text-anchor="middle" class="f-green-ink">Topic</text><circle cx="39" cy="746.5" r="2.5" class="f-accent"/><text x="50" y="751" font-size="13" font-weight="400" class="f-ink">Each subscriber gets its own copy</text><circle cx="39" cy="769.5" r="2.5" class="f-accent"/><text x="50" y="774" font-size="13" font-weight="400" class="f-ink">SNS stores nothing; the SQS queues add</text><text x="50" y="792" font-size="13" font-weight="400" class="f-ink">durability and retries</text><circle cx="39" cy="810.5" r="2.5" class="f-accent"/><text x="50" y="815" font-size="13" font-weight="400" class="f-ink">Subscribers: SQS, Lambda, HTTPS, email, SMS</text><rect x="20" y="851" width="350" height="352" rx="14" class="f-panel"/><text x="36" y="885" font-size="17" font-weight="700" class="f-ink">Kinesis Data Streams</text><rect x="290" y="867" width="64" height="22" rx="11" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="322" y="882.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">Stream</text><text x="36" y="909" font-size="13" font-weight="400" class="f-muted">Producers append ordered records to shards.</text><text x="36" y="927" font-size="13" font-weight="400" class="f-muted">Many applications read the same records</text><text x="36" y="945" font-size="13" font-weight="400" class="f-muted">independently.</text><rect x="36" y="985" width="78" height="40" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="75" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Producers</text><line x1="114" y1="1005" x2="128" y2="1005" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="128" y="979" width="140" height="52" rx="8" stroke-width="1" class="f-violet-fill s-violet-line"/><rect x="136" y="993" width="18" height="24" rx="4" stroke-width="1" class="f-canvas s-violet-line"/><text x="145" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">1</text><rect x="158" y="993" width="18" height="24" rx="4" stroke-width="1" class="f-canvas s-violet-line"/><text x="167" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">2</text><rect x="180" y="993" width="18" height="24" rx="4" stroke-width="1" class="f-canvas s-violet-line"/><text x="189" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">3</text><rect x="202" y="993" width="18" height="24" rx="4" stroke-width="1" class="f-canvas s-violet-line"/><text x="211" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">4</text><rect x="224" y="993" width="18" height="24" rx="4" stroke-width="1" class="f-canvas s-violet-line"/><text x="233" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">5</text><rect x="246" y="993" width="18" height="24" rx="4" stroke-width="1" class="f-canvas s-violet-line"/><text x="255" y="1009.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">6</text><path d="M268 1005 H275 V985 H282" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><path d="M268 1005 H275 V1025 H282" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#messaging-m-acc)" class="s-accent"/><rect x="282" y="969" width="74" height="32" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="319" y="989.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Reader A</text><rect x="282" y="1009" width="74" height="32" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="319" y="1029.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Reader B</text><path d="M250 1031 V1047 H145 V1019" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#messaging-m-acc)" class="s-accent"/><text x="197" y="1067" font-size="13" font-weight="600" text-anchor="middle" class="f-accent">Replay from any position</text><circle cx="39" cy="1094.5" r="2.5" class="f-accent"/><text x="50" y="1099" font-size="13" font-weight="400" class="f-ink">Records stay 24 hours by default, up to 365</text><text x="50" y="1117" font-size="13" font-weight="400" class="f-ink">days</text><circle cx="39" cy="1135.5" r="2.5" class="f-accent"/><text x="50" y="1140" font-size="13" font-weight="400" class="f-ink">Each reader tracks its own position and can</text><text x="50" y="1158" font-size="13" font-weight="400" class="f-ink">replay</text><circle cx="39" cy="1176.5" r="2.5" class="f-accent"/><text x="50" y="1181" font-size="13" font-weight="400" class="f-ink">Real-time analytics: clickstreams, logs, IoT</text><rect x="20" y="1227" width="350" height="138" rx="12" class="f-panel"/><text x="36" y="1255" font-size="13" font-weight="700" class="f-ink">Which one?</text><circle cx="39" cy="1276.5" r="2.5" class="f-accent"/><text x="50" y="1281" font-size="13" font-weight="400" class="f-ink">Decouple and buffer work → SQS</text><circle cx="39" cy="1299.5" r="2.5" class="f-accent"/><text x="50" y="1304" font-size="13" font-weight="400" class="f-ink">Notify many subscribers at once → SNS</text><circle cx="39" cy="1322.5" r="2.5" class="f-accent"/><text x="50" y="1327" font-size="13" font-weight="400" class="f-ink">Real-time stream, many readers, replay →</text><text x="50" y="1345" font-size="13" font-weight="400" class="f-ink">Kinesis</text></svg>
