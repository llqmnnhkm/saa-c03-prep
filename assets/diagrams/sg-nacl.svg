<svg class="ig-svg" role="img" aria-label="Security group vs network ACL" xmlns="http://www.w3.org/2000/svg" viewBox="0 154 390 1132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="sg-nacl-m-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-accent"/></marker><marker id="sg-nacl-m-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="s-muted"/></marker></defs><rect width="390" height="1132" class="f-canvas" y="154"/><rect x="20" y="222" width="350" height="274" rx="12" stroke-width="1" class="f-panel s-line"/><text x="32" y="242" font-size="13" font-weight="600" class="f-muted">VPC</text><rect x="40" y="262" width="310" height="216" rx="10" stroke-width="2" stroke-dasharray="6 4" class="f-canvas s-violet-line"/><rect x="70" y="326" width="260" height="130" rx="10" stroke-width="2" stroke-dasharray="6 4" class="f-amber-fill s-amber-line"/><line x1="140" y1="198" x2="140" y2="371" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sg-nacl-m-acc)" class="s-accent"/><line x1="180" y1="371" x2="180" y2="198" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#sg-nacl-m-mut)" class="s-muted"/><text x="132" y="248" font-size="13" font-weight="600" text-anchor="end" class="f-accent">Request</text><text x="188" y="248" font-size="13" font-weight="600" class="f-muted">Response</text><rect x="110" y="371" width="170" height="60" rx="8" stroke-width="1" class="f-canvas s-line"/><text x="195" y="405.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">EC2 instance</text><rect x="135" y="166" width="120" height="32" rx="16" stroke-width="1" class="f-panel s-line"/><text x="195" y="186.5" font-size="13" font-weight="600" text-anchor="middle" class="f-ink">Internet</text><rect x="196" y="315" width="122" height="22" rx="11" stroke-width="1" class="f-canvas s-amber-line"/><text x="257" y="330.5" font-size="13" font-weight="600" text-anchor="middle" class="f-amber-ink">Security group</text><rect x="238" y="467" width="100" height="22" rx="11" stroke-width="1" class="f-canvas s-violet-line"/><text x="288" y="482.5" font-size="13" font-weight="600" text-anchor="middle" class="f-violet-ink">Network ACL</text><rect x="20" y="524" width="170" height="36" rx="8" stroke-width="1" class="f-violet-fill s-violet-line"/><text x="105" y="547" font-size="13" font-weight="700" text-anchor="middle" class="f-violet-ink">Network ACL</text><rect x="200" y="524" width="170" height="36" rx="8" stroke-width="1" class="f-amber-fill s-amber-line"/><text x="285" y="547" font-size="13" font-weight="700" text-anchor="middle" class="f-amber-ink">Security group</text><text x="20" y="590" font-size="13" font-weight="600" letter-spacing="0.6" class="f-muted">WHERE IT SITS</text><rect x="20" y="600" width="170" height="58" rx="8" class="f-panel"/><rect x="200" y="600" width="170" height="58" rx="8" class="f-panel"/><text x="32" y="623" font-size="13" font-weight="600" class="f-ink">Subnet edge</text><text x="212" y="623" font-size="13" font-weight="600" class="f-ink">Instance (network</text><text x="212" y="641" font-size="13" font-weight="600" class="f-ink">interface)</text><text x="20" y="686" font-size="13" font-weight="600" letter-spacing="0.6" class="f-muted">STATE</text><rect x="20" y="696" width="170" height="40" rx="8" class="f-panel"/><rect x="200" y="696" width="170" height="40" rx="8" class="f-panel"/><text x="32" y="719" font-size="13" font-weight="600" class="f-ink">Stateless</text><text x="212" y="719" font-size="13" font-weight="600" class="f-ink">Stateful</text><text x="20" y="764" font-size="13" font-weight="600" letter-spacing="0.6" class="f-muted">RULE TYPES</text><rect x="20" y="774" width="170" height="40" rx="8" class="f-panel"/><rect x="200" y="774" width="170" height="40" rx="8" class="f-panel"/><text x="32" y="797" font-size="13" font-weight="600" class="f-ink">Allow and deny</text><text x="212" y="797" font-size="13" font-weight="600" class="f-ink">Allow only</text><text x="20" y="842" font-size="13" font-weight="600" letter-spacing="0.6" class="f-muted">EVALUATION</text><rect x="20" y="852" width="170" height="76" rx="8" class="f-panel"/><rect x="200" y="852" width="170" height="76" rx="8" class="f-panel"/><text x="32" y="875" font-size="13" font-weight="400" class="f-ink">Numbered rules,</text><text x="32" y="893" font-size="13" font-weight="400" class="f-ink">lowest first; first</text><text x="32" y="911" font-size="13" font-weight="400" class="f-ink">match wins</text><text x="212" y="875" font-size="13" font-weight="400" class="f-ink">All rules evaluated</text><text x="212" y="893" font-size="13" font-weight="400" class="f-ink">together</text><text x="20" y="956" font-size="13" font-weight="600" letter-spacing="0.6" class="f-muted">RETURN TRAFFIC</text><rect x="20" y="966" width="170" height="76" rx="8" class="f-panel"/><rect x="200" y="966" width="170" height="76" rx="8" class="f-panel"/><text x="32" y="989" font-size="13" font-weight="400" class="f-ink">Must be allowed</text><text x="32" y="1007" font-size="13" font-weight="400" class="f-ink">explicitly, including</text><text x="32" y="1025" font-size="13" font-weight="400" class="f-ink">ephemeral ports</text><text x="212" y="989" font-size="13" font-weight="400" class="f-ink">Allowed automatically</text><text x="20" y="1070" font-size="13" font-weight="600" letter-spacing="0.6" class="f-muted">DEFAULT</text><rect x="20" y="1080" width="170" height="76" rx="8" class="f-panel"/><rect x="200" y="1080" width="170" height="76" rx="8" class="f-panel"/><text x="32" y="1103" font-size="13" font-weight="400" class="f-ink">Default NACL allows</text><text x="32" y="1121" font-size="13" font-weight="400" class="f-ink">all; a new custom</text><text x="32" y="1139" font-size="13" font-weight="400" class="f-ink">NACL denies all</text><text x="212" y="1103" font-size="13" font-weight="400" class="f-ink">New group denies all</text><text x="212" y="1121" font-size="13" font-weight="400" class="f-ink">inbound, allows all</text><text x="212" y="1139" font-size="13" font-weight="400" class="f-ink">outbound</text><rect x="20" y="1178" width="350" height="88" rx="12" class="f-tip-fill"/><text x="36" y="1206" font-size="13" font-weight="700" class="f-accent">Exam tip</text><text x="36" y="1228" font-size="13" font-weight="400" class="f-ink">To block a specific IP address, add a deny</text><text x="36" y="1246" font-size="13" font-weight="400" class="f-ink">rule to the NACL. Security groups cannot deny.</text></svg>
